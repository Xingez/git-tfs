name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Windows / .NET 10
    runs-on: windows-2022

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.302

      - name: Restore
        run: dotnet restore src/GitTfs.slnx

      - name: Run tests
        run: >-
          dotnet test src/GitTfs.slnx
          --configuration Release
          --no-restore
          --logger "trx;LogFileName=git-tfs-tests.trx"
          --results-directory "$env:RUNNER_TEMP\git-tfs-test-results"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ${{ runner.temp }}/git-tfs-test-results/**/*.trx
          if-no-files-found: ignore
          retention-days: 7
